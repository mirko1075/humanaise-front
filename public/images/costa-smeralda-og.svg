<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D3A"/>
      <stop offset="60%" style="stop-color:#0e2347"/>
      <stop offset="100%" style="stop-color:#1a1060"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4A55A;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#C4A55A;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle gold left bar -->
  <rect x="0" y="0" width="6" height="630" fill="#C4A55A" opacity="0.8"/>

  <!-- Decorative circle blur (simulated) -->
  <circle cx="950" cy="180" r="220" fill="#C4A55A" opacity="0.04"/>
  <circle cx="200" cy="480" r="180" fill="#4f46e5" opacity="0.06"/>

  <!-- HUMANAISE brand -->
  <text x="72" y="80" font-family="Georgia, serif" font-size="18" font-weight="700" letter-spacing="6" fill="#C4A55A" opacity="0.9">HUMANAISE</text>

  <!-- Badge -->
  <rect x="72" y="120" width="260" height="34" rx="17" fill="#C4A55A" opacity="0.12"/>
  <rect x="72" y="120" width="260" height="34" rx="17" fill="none" stroke="#C4A55A" stroke-width="1" opacity="0.4"/>
  <text x="202" y="143" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#C4A55A" text-anchor="middle" dominant-baseline="middle">PILOT GRATUITO 30 GIORNI</text>

  <!-- Main title -->
  <text x="72" y="240" font-family="Georgia, serif" font-size="62" font-weight="700" fill="#FFFFFF" opacity="0.97">AI Concierge per</text>
  <text x="72" y="320" font-family="Georgia, serif" font-size="62" font-weight="700" fill="#C4A55A">Costa Smeralda</text>

  <!-- Subtitle -->
  <text x="72" y="390" font-family="system-ui, sans-serif" font-size="22" fill="#FFFFFF" opacity="0.65">Assistente WhatsApp per ville di lusso, yacht e servizi concierge</text>

  <!-- Divider -->
  <rect x="72" y="440" width="80" height="2" fill="#C4A55A" opacity="0.6"/>

  <!-- Footer tags -->
  <text x="72" y="490" font-family="system-ui, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.45">Porto Cervo  ·  Porto Rotondo  ·  Arzachena  ·  24/7 in 4 lingue</text>

  <!-- humanaise.com -->
  <text x="1128" y="600" font-family="system-ui, sans-serif" font-size="16" fill="#C4A55A" opacity="0.5" text-anchor="end">humanaise.com</text>
</svg>

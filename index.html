<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Consent Mode v2: everything denied until the visitor accepts in CookieBanner.
         Stored choice is read here so a returning "accepted" visitor is granted before GTM loads.
         Named gtagConsent (not gtag) on purpose: trackEvent() already pushes events to dataLayer. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtagConsent() { dataLayer.push(arguments); }
      var consentValue = 'denied';
      try { if (localStorage.getItem('humanaise_cookie_consent') === 'accepted') consentValue = 'granted'; } catch (e) {}
      gtagConsent('consent', 'default', {
        ad_storage: consentValue, ad_user_data: consentValue, ad_personalization: consentValue,
        analytics_storage: consentValue, wait_for_update: 500
      });
    </script>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-M8QKFTRC');</script>
    <!-- End Google Tag Manager -->
    <!-- Umami (self-hosted, cookieless). data-domains keeps previews/localhost out of the stats. -->
    <script defer src="https://stats.humanaise.com/script.js"
      data-website-id="243cb30d-4ee5-49a4-8552-8af6e7c3780e"
      data-domains="humanaise.com,www.humanaise.com,humanaiseai.netlify.app"></script>
    <!-- Umami heatmaps recorder (heatmaps enabled, replays off; sample rate set in Umami settings) -->
    <script defer src="https://stats.humanaise.com/recorder.js"
